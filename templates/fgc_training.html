<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>FGC Syria Agent Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5fa; --card: #ffffff; --border: #e6e3ef; --text: #1b1a22; --dim: #6e6b7d;
    --accent: #6128DB; --accent-soft: #efe9fd; --me: #6128DB; --me-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0a0a0f; --card: #111118; --border: #23222f; --text: #e8e8f0; --dim: #8a879b;
            --accent: #7c4dff; --accent-soft: #1c1630; --me: #6128DB; --me-text: #ffffff; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 16px/1.55 Inter, "Noto Sans Arabic", system-ui, sans-serif; }
  .wrap { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; }
  header { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 13px; color: var(--dim); }
  #log { flex: 1; overflow-y: auto; padding: 24px 16px; -webkit-overflow-scrolling: touch; }
  .msg { max-width: 85%; margin: 0 0 14px; padding: 12px 15px; border-radius: 16px; white-space: pre-wrap;
         word-wrap: break-word; unicode-bidi: plaintext; }
  .bot { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .me { background: var(--me); color: var(--me-text); margin-left: auto; border-bottom-right-radius: 4px; }
  .typing { color: var(--dim); font-size: 14px; padding: 4px 6px 14px; }
  form.bar { display: flex; gap: 8px; align-items: flex-end; padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
             border-top: 1px solid var(--border); background: var(--bg); }
  textarea { flex: 1; resize: none; max-height: 160px; min-height: 46px; padding: 12px 14px; border-radius: 14px;
             border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit; unicode-bidi: plaintext; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button, label.att { height: 46px; min-width: 46px; border: 0; border-radius: 14px; cursor: pointer; font: inherit; }
  button.send { background: var(--accent); color: #fff; padding: 0 18px; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  label.att { display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 20px; }
  #files { display: none; }
  .chips { font-size: 12px; color: var(--dim); padding: 0 16px 6px; min-height: 0; }
  .login { margin: auto; width: 100%; max-width: 360px; padding: 32px 20px; text-align: center; }
  .login h1 { font-size: 20px; margin: 0 0 6px; }
  .login p { color: var(--dim); margin: 0 0 22px; font-size: 14px; }
  .login input { width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border);
                 background: var(--card); color: var(--text); font: inherit; margin-bottom: 12px; }
  .login button { width: 100%; background: var(--accent); color: #fff; font-weight: 600; }
</style>
</head>
<body>
{% if not authed %}
<div class="wrap">
  <form class="login" method="post" action="/FGCagenttraining">
    <h1>FGC Syria Agent Training</h1>
    <p>Enter the password to continue.</p>
    <input type="password" name="password" placeholder="Password" autofocus autocomplete="current-password">
    <button type="submit">Enter</button>
  </form>
</div>
{% else %}
<div class="wrap">
  <header>
    <h1>FGC Syria Agent Training</h1>
    <p>Everything here is saved. Close it any time and pick up where you left off.</p>
  </header>
  <div id="log"></div>
  <div class="chips" id="chips"></div>
  <form class="bar" id="bar">
    <label class="att" title="Add screenshots">+<input type="file" id="files" accept="image/*" multiple></label>
    <textarea id="text" rows="1" placeholder="Type your answer…"></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</div>
<script>
const log = document.getElementById('log'), text = document.getElementById('text'),
      send = document.getElementById('send'), files = document.getElementById('files'),
      chips = document.getElementById('chips');
let busy = false;

function add(role, t) {
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'me' : 'bot');
  d.dir = 'auto';
  d.textContent = t;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function typing(on) {
  let t = document.getElementById('typing');
  if (on && !t) { t = document.createElement('div'); t.id = 'typing'; t.className = 'typing'; t.textContent = 'Thinking…'; log.appendChild(t); }
  if (!on && t) t.remove();
  log.scrollTop = log.scrollHeight;
}
function notice(t) {
  let n = document.getElementById('notice');
  if (!t) { if (n) n.remove(); return; }
  if (!n) { n = document.createElement('div'); n.id = 'notice'; n.className = 'typing'; log.appendChild(n); }
  n.textContent = t; log.scrollTop = log.scrollHeight;
}
// What the server has saved is the truth: after any hiccup the chat is redrawn from it.
async function sync() {
  const r = await fetch('/FGCagenttraining/api/history', { cache: 'no-store' });
  if (r.status === 401) { location.reload(); return null; }
  const j = await r.json();
  log.textContent = '';
  j.messages.forEach(m => add(m.role, m.text));
  return j.messages;
}
const wait = ms => new Promise(ok => setTimeout(ok, ms));
// Keeps checking through dropped connections and locked phones. The server finishes either way.
async function follow() {
  busy = true; send.disabled = true; typing(true);
  for (let i = 0; i < 200; i++) {
    await wait(2500);
    try {
      const s = await fetch('/FGCagenttraining/api/status', { cache: 'no-store' });
      if (s.status === 401) { location.reload(); return; }
      const j = await s.json();
      if (!j.pending) break;
      if (j.delayed) { typing(false); notice('Your message is saved. The answer is taking longer than usual and will appear here by itself.'); }
    } catch (e) { /* offline for a moment, keep trying */ }
  }
  typing(false); notice('');
  try { await sync(); } catch (e) {}
  busy = false; send.disabled = false; text.focus();
}
async function post(fd, typed) {
  busy = true; send.disabled = true; typing(true);
  let j = {}, status = 0;
  try {
    const r = await fetch('/FGCagenttraining/api/chat', { method: 'POST', body: fd });
    status = r.status;
    j = await r.json().catch(() => ({}));
  } catch (e) {
    status = -1;   // it may or may not have arrived, so look at what was saved
  }
  if (status === 401) { location.reload(); return; }
  if (status === 400) {
    typing(false); busy = false; send.disabled = false;
    add('assistant', j.error || 'That could not be sent. Please try again.');
    return;
  }
  if (status !== 200) {
    let saved = false;
    try {
      const m = await sync();
      const mine = (m || []).filter(x => x.role === 'user');
      saved = !typed || (mine.length && mine[mine.length - 1].text.trim() === typed);
    } catch (e) {}
    if (!saved) {
      typing(false); busy = false; send.disabled = false;
      text.value = typed;
      add('assistant', 'That did not send, your connection dropped. Your message is back in the box, press Send again.');
      return;
    }
  }
  await follow();
}
// Phone photos are often too big for the server, so shrink them first.
function shrink(file) {
  return new Promise(ok => {
    if (file.size < 3 * 1024 * 1024) return ok(file);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = img.width * k; c.height = img.height * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); ok(b ? new File([b], 'photo.jpg', { type: 'image/jpeg' }) : file); }, 'image/jpeg', 0.85);
    };
    img.onerror = () => ok(file);
    img.src = url;
  });
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !busy) sync().catch(() => {});
});
files.addEventListener('change', () => {
  chips.textContent = files.files.length ? files.files.length + ' image(s) attached' : '';
});
text.addEventListener('input', () => { text.style.height = 'auto'; text.style.height = Math.min(text.scrollHeight, 160) + 'px'; });
text.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(pointer:fine)').matches) { e.preventDefault(); document.getElementById('bar').requestSubmit(); }
});
document.getElementById('bar').addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;
  const t = text.value.trim();
  if (!t && !files.files.length) return;
  busy = true;
  const fd = new FormData();
  fd.append('text', t);
  for (const f of files.files) fd.append('images', await shrink(f));
  add('user', (files.files.length ? '[' + files.files.length + ' image(s)] ' : '') + t);
  text.value = ''; text.style.height = 'auto'; files.value = ''; chips.textContent = '';
  post(fd, t);
});
(async () => {
  try {
    const m = await sync();
    if (m && m.length && m[m.length - 1].role === 'user') follow();
    else fetch('/FGCagenttraining/api/status');   // finishes any unfinished check
  } catch (e) { add('assistant', 'Could not load the chat. Check your connection and refresh.'); }
})();
</script>
{% endif %}
</body>
</html>
